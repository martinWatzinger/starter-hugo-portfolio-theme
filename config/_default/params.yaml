# SITE SETUP
# Rotary Club Münster-Westfalen

# Appearance
appearance:
  theme_day: custom
  theme_night: custom
  font: minimal
  font_size: L

# SEO
marketing:
  seo:
    site_type: Organization
    local_business_type: ''
    org_name: 'Rotary Club Münster-Westfalen'
    description: 'Rotary Club Münster-Westfalen – Menschen, die helfen. Seit 2010 engagieren wir uns für eine bessere Welt in Münster und darüber hinaus.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    align: r
    show_logo: false
    show_language: false
    show_day_night: true
    show_search: false
    highlight_active_link: true

footer:
  copyright:
    notice: '© {year} Rotary Club Münster-Westfalen | <a href="https://www.rotary.org" target="_blank">Rotary International</a>'
    license:
      enable: false

# Localization
locale:
  date_format: '02. Jan 2006'
  time_format: '15:04 Uhr'

# Site features
features:
  syntax_highlighter:
    enable: false
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/martinwatzinger/starter-hugo-portfolio-theme'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
  search:
    provider: ''
  map:
    provider: ''
    zoom: 14

extensions:
  cms:
    branch: main
    local_backend: false
  academicons:
    enable: false
