<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Fahren!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #87CEEB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: 2.4rem;
      color: #fff;
      text-shadow: 3px 3px 0 #e74c3c, 5px 5px 0 rgba(0,0,0,0.2);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    #hud {
      display: flex;
      gap: 20px;
      margin-bottom: 8px;
      font-size: 1.2rem;
      background: rgba(255,255,255,0.85);
      padding: 8px 24px;
      border-radius: 40px;
      border: 3px solid #e74c3c;
      box-shadow: 0 3px 0 #c0392b;
    }

    #hud .item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #333;
    }

    /* Health hearts */
    #hearts { font-size: 1.4rem; letter-spacing: 2px; }

    canvas {
      display: block;
      border: 4px solid #fff;
      border-radius: 10px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 0 0 4px #e74c3c;
    }

    #controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .ctrl-btn {
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.9);
      border: 3px solid #e74c3c;
      border-radius: 12px;
      font-size: 1.8rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #c0392b;
      transition: transform 0.08s, box-shadow 0.08s;
      touch-action: manipulation;
    }
    .ctrl-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c0392b; }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .card {
      background: rgba(255,255,255,0.95);
      border: 5px solid #e74c3c;
      border-radius: 24px;
      padding: 36px 56px;
      text-align: center;
      box-shadow: 0 8px 0 #c0392b, 0 12px 30px rgba(0,0,0,0.3);
      max-width: 480px;
    }

    .card h2 {
      font-size: 2.6rem;
      color: #e74c3c;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.8;
      margin-bottom: 8px;
    }

    .card .big-score {
      font-size: 2rem;
      color: #f39c12;
      font-weight: bold;
      margin: 10px 0;
    }

    #startBtn {
      margin-top: 20px;
      padding: 16px 52px;
      font-size: 1.4rem;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 6px 0 #c0392b;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #startBtn:hover { transform: scale(1.06); }
    #startBtn:active { transform: translateY(3px); box-shadow: 0 3px 0 #c0392b; }

    /* wrap for overlay positioning */
    #wrap { position: relative; }
  </style>
</head>
<body>

<h1>🚗 AUTO FAHREN!</h1>

<div id="hud">
  <div class="item">⭐ <span id="score">0</span></div>
  <div class="item">🏁 <span id="dist">0</span> m</div>
  <div class="item">💨 <span id="kmh">0</span> km/h</div>
  <div class="item" id="hearts">❤️❤️❤️</div>
</div>

<div id="wrap">
  <canvas id="c" width="800" height="420"></canvas>

  <div id="overlay">
    <div class="card" id="menuCard">
      <h2>🚗 AUTO FAHREN!</h2>
      <p>
        Fahre so weit wie möglich!<br>
        Sammle <strong>⭐ Sterne</strong> und weiche<br>
        <strong>🪨 Steinen</strong> und <strong>🚧 Baustellen</strong> aus!
      </p>
      <p>
        <strong>↑ Gas geben</strong><br>
        <strong>↓ Bremsen</strong><br>
        <strong>LEERTASTE Springen</strong>
      </p>
      <div id="finalScore" class="big-score" style="display:none"></div>
      <button id="startBtn">🚦 LOS GEHT'S!</button>
    </div>
  </div>
</div>

<div id="controls">
  <button class="ctrl-btn" id="btnLeft">⬅️</button>
  <button class="ctrl-btn" id="btnUp">⬆️</button>
  <button class="ctrl-btn" id="btnJump">⬆️🚗</button>
  <button class="ctrl-btn" id="btnDown">⬇️</button>
  <button class="ctrl-btn" id="btnRight">➡️</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Road layout ──────────────────────────────────────────────────────
const ROAD_TOP    = H * 0.52;
const ROAD_BOTTOM = H * 0.92;
const ROAD_MID    = (ROAD_TOP + ROAD_BOTTOM) / 2;
const LANE_H      = (ROAD_BOTTOM - ROAD_TOP) / 2;
// Two lanes: top lane y center, bottom lane y center
const LANES = [ROAD_TOP + LANE_H / 2, ROAD_TOP + LANE_H * 1.5];

// ── Game state ───────────────────────────────────────────────────────
let speed, worldX, score, hp, lane, jumping, jumpVY, jumpY, dist, gameState;
let stars, obstacles, particles, popups, clouds, trees, houses, mountains;
let frameN, lastObstacle, lastStar, coinStreak;

function init() {
  speed       = 0;
  worldX      = 0;
  score       = 0;
  hp          = 3;
  lane        = 1;        // 0 = top lane, 1 = bottom lane
  jumping     = false;
  jumpVY      = 0;
  jumpY       = 0;        // offset from lane center
  dist        = 0;
  gameState   = 'playing';
  frameN      = 0;
  lastObstacle= 200;
  lastStar    = 60;
  coinStreak  = 0;
  stars       = [];
  obstacles   = [];
  particles   = [];
  popups      = [];
  buildScenery();
  spawnStar();
  updateHUD();
}

// ── Scenery ──────────────────────────────────────────────────────────
function buildScenery() {
  clouds = [];
  for (let i = 0; i < 10; i++) clouds.push({ x: Math.random() * W * 3, y: 30 + Math.random() * 90, w: 70 + Math.random() * 100 });
  trees = [];
  for (let i = 0; i < 60; i++) trees.push({ x: 80 + i * 220 + Math.random() * 120, y: ROAD_TOP - 20 - Math.random() * 40, r: 16 + Math.random() * 18, color: Math.random() > 0.3 ? '#27ae60' : '#16a085' });
  houses = [];
  for (let i = 0; i < 25; i++) houses.push({ x: 200 + i * 500 + Math.random() * 200, y: ROAD_TOP - 10, w: 50 + Math.random() * 30, h: 38 + Math.random() * 20, color: `hsl(${Math.floor(Math.random()*360)},55%,65%)` });
  mountains = [];
  for (let i = 0; i < 10; i++) mountains.push({ x: i * 900 + Math.random() * 400, h: 70 + Math.random() * 80, w: 220 + Math.random() * 160 });
}

// ── Spawners ─────────────────────────────────────────────────────────
function spawnStar() {
  stars.push({ x: W + 60, lane: Math.floor(Math.random() * 2), pulse: 0, type: Math.random() < 0.15 ? 'super' : 'normal' });
}

function spawnObstacle() {
  const types = ['rock','cone','pothole'];
  const t = types[Math.floor(Math.random() * types.length)];
  obstacles.push({ x: W + 60, lane: Math.floor(Math.random() * 2), type: t, hit: false, hitAnim: 0 });
}

// ── Input ────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (gameState === 'playing') doJump();
  }
  if (e.code === 'ArrowDown' && gameState === 'playing') { e.preventDefault(); switchLane(1); }
  if (e.code === 'ArrowUp'   && gameState === 'playing') { e.preventDefault(); switchLane(-1); }
  if ((e.code === 'Enter' || e.code === 'Space') && gameState === 'dead') startGame();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function doJump() {
  if (!jumping) { jumping = true; jumpVY = -14; playSound('jump'); }
}
function switchLane(d) {
  const newLane = Math.max(0, Math.min(1, lane + d));
  if (newLane !== lane) { lane = newLane; playSound('lane'); }
}

// Mobile buttons
document.getElementById('btnUp').addEventListener('touchstart',   e => { e.preventDefault(); switchLane(-1); });
document.getElementById('btnDown').addEventListener('touchstart', e => { e.preventDefault(); switchLane(1); });
document.getElementById('btnJump').addEventListener('touchstart', e => { e.preventDefault(); doJump(); });
document.getElementById('btnLeft').addEventListener('touchstart', e => { e.preventDefault(); speed = Math.max(0, speed - 1); });
document.getElementById('btnRight').addEventListener('touchstart',e => { e.preventDefault(); speed = Math.min(14, speed + 1); });
document.getElementById('btnUp').addEventListener('click',    () => switchLane(-1));
document.getElementById('btnDown').addEventListener('click',  () => switchLane(1));
document.getElementById('btnJump').addEventListener('click',  () => doJump());
document.getElementById('btnLeft').addEventListener('click',  () => { speed = Math.max(0, speed - 1); });
document.getElementById('btnRight').addEventListener('click', () => { speed = Math.min(14, speed + 1); });

// ── Audio ────────────────────────────────────────────────────────────
let ac;
function getAC() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function playSound(type) {
  try {
    const a = getAC();
    if (type === 'star') {
      [880, 1100, 1320].forEach((f, i) => {
        const o = a.createOscillator(), g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(0.15, a.currentTime + i*0.08);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + i*0.08+0.15);
        o.start(a.currentTime + i*0.08); o.stop(a.currentTime + i*0.08+0.15);
      });
    } else if (type === 'hit') {
      const o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.type = 'sawtooth'; o.frequency.setValueAtTime(200, a.currentTime);
      o.frequency.exponentialRampToValueAtTime(80, a.currentTime+0.3);
      g.gain.setValueAtTime(0.3, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.3);
      o.start(); o.stop(a.currentTime+0.3);
    } else if (type === 'jump') {
      const o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.type = 'sine'; o.frequency.setValueAtTime(400, a.currentTime);
      o.frequency.exponentialRampToValueAtTime(900, a.currentTime+0.2);
      g.gain.setValueAtTime(0.12, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.2);
      o.start(); o.stop(a.currentTime+0.2);
    } else if (type === 'gameover') {
      [400,300,200,150].forEach((f, i) => {
        const o = a.createOscillator(), g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.type = 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(0.15, a.currentTime + i*0.15);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + i*0.15+0.15);
        o.start(a.currentTime + i*0.15); o.stop(a.currentTime + i*0.15+0.15);
      });
    } else if (type === 'lane') {
      const o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.type = 'sine'; o.frequency.value = 600;
      g.gain.setValueAtTime(0.08, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.1);
      o.start(); o.stop(a.currentTime+0.1);
    }
  } catch(e) {}
}

// ── Particles ────────────────────────────────────────────────────────
function burst(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2, life: 1, color, r: 3+Math.random()*5 });
  }
}

function addPopup(text, x, y, color = '#f1c40f') {
  popups.push({ text, x, y, life: 1, vy: -2, color });
}

// ── Update ────────────────────────────────────────────────────────────
function update() {
  if (gameState !== 'playing') return;
  frameN++;

  // Speed control
  if (keys['ArrowRight'] || keys['KeyD']) speed = Math.min(14, speed + 0.12);
  else speed = Math.max(2, speed - 0.04);   // auto-drive, slight deceleration
  if (keys['ArrowLeft']  || keys['KeyA']) speed = Math.max(0, speed - 0.15);

  worldX += speed;
  dist = Math.floor(worldX / 10);

  // Jump physics
  if (jumping) {
    jumpY  += jumpVY;
    jumpVY += 1.1;   // gravity
    if (jumpY >= 0) { jumpY = 0; jumpVY = 0; jumping = false; }
  }

  // Spawn
  lastStar--;
  if (lastStar <= 0) {
    spawnStar();
    lastStar = Math.max(40, 120 - speed * 4);
  }
  lastObstacle--;
  if (lastObstacle <= 0) {
    if (dist > 50) spawnObstacle();
    lastObstacle = Math.max(60, 220 - speed * 8);
  }

  const carX = 140, carY = LANES[lane] + jumpY;
  const carW = 64, carH = 32;

  // Stars
  for (const s of stars) {
    s.x -= speed;
    s.pulse += 0.1;
  }
  const collected = stars.filter(s => {
    const sy = LANES[s.lane];
    return Math.abs(s.x - carX) < 36 && Math.abs(sy - carY) < 28;
  });
  collected.forEach(s => {
    const pts = s.type === 'super' ? 5 : 1;
    score += pts;
    burst(s.x, LANES[s.lane], s.type === 'super' ? '#e74c3c' : '#f1c40f', 12);
    addPopup(s.type === 'super' ? '+5 ⭐' : '+1 ⭐', s.x, LANES[s.lane] - 30, s.type === 'super' ? '#e74c3c' : '#f1c40f');
    playSound('star');
  });
  stars = stars.filter(s => s.x > -60 && !collected.includes(s));

  // Obstacles
  for (const o of obstacles) {
    o.x -= speed;
    if (o.hit) { o.hitAnim++; continue; }
    const oy = LANES[o.lane];
    const hit = Math.abs(o.x - carX) < 38 && Math.abs(oy - carY) < 26;
    if (hit) {
      o.hit = true; o.hitAnim = 0;
      hp--;
      burst(o.x, oy, '#e74c3c', 16);
      addPopup('💥 Autsch!', o.x, oy - 40, '#e74c3c');
      playSound('hit');
      updateHUD();
      if (hp <= 0) { setTimeout(triggerDead, 300); gameState = 'dying'; }
    }
  }
  obstacles = obstacles.filter(o => o.x > -80);

  // Particles / popups
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.03; });
  particles = particles.filter(p => p.life > 0);
  popups.forEach(p => { p.x += p.vx || 0; p.y += p.vy; p.life -= 0.022; });
  popups = popups.filter(p => p.life > 0);

  updateHUD();
}

function triggerDead() {
  gameState = 'dead';
  playSound('gameover');
  showOverlay();
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('dist').textContent  = dist;
  document.getElementById('kmh').textContent   = Math.round(speed * 9);
  const h = document.getElementById('hearts');
  h.textContent = '❤️'.repeat(Math.max(0, hp)) + '🖤'.repeat(Math.max(0, 3 - hp));
}

// ── Drawing ──────────────────────────────────────────────────────────
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, ROAD_TOP);
  g.addColorStop(0, '#5bc0de');
  g.addColorStop(1, '#a8e4f8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, ROAD_TOP);
}

function drawMountains() {
  for (const m of mountains) {
    const sx = m.x - worldX * 0.15;
    ctx.fillStyle = '#7fb3c8';
    ctx.beginPath();
    ctx.moveTo(sx, ROAD_TOP);
    ctx.lineTo(sx + m.w/2, ROAD_TOP - m.h);
    ctx.lineTo(sx + m.w, ROAD_TOP);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(sx + m.w/2 - 18, ROAD_TOP - m.h + 22);
    ctx.lineTo(sx + m.w/2, ROAD_TOP - m.h);
    ctx.lineTo(sx + m.w/2 + 18, ROAD_TOP - m.h + 22);
    ctx.fill();
  }
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (const c of clouds) {
    const cx = (c.x - worldX * 0.2) % (W * 4);
    ctx.beginPath();
    ctx.arc(cx,            c.y, c.w*0.28, 0, Math.PI*2);
    ctx.arc(cx + c.w*0.3,  c.y-10, c.w*0.23, 0, Math.PI*2);
    ctx.arc(cx + c.w*0.6,  c.y, c.w*0.25, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawTrees() {
  for (const t of trees) {
    const sx = t.x - worldX;
    if (sx < -40 || sx > W+40) continue;
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(sx - 4, t.y + t.r, 8, 18);
    ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.arc(sx, t.y, t.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath(); ctx.arc(sx + 4, t.y + 4, t.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.arc(sx, t.y, t.r, 0, Math.PI*2); ctx.fill();
  }
}

function drawHouses() {
  for (const h of houses) {
    const sx = h.x - worldX;
    if (sx < -80 || sx > W+80) continue;
    const ty = h.y - h.h;
    ctx.fillStyle = h.color;
    ctx.fillRect(sx, ty, h.w, h.h);
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.moveTo(sx-4, ty);
    ctx.lineTo(sx + h.w/2, ty - 20);
    ctx.lineTo(sx + h.w+4, ty);
    ctx.fill();
    ctx.fillStyle = '#aee6f5';
    ctx.fillRect(sx + h.w*0.15, ty + h.h*0.2, h.w*0.28, h.h*0.35);
    ctx.fillRect(sx + h.w*0.55, ty + h.h*0.2, h.w*0.28, h.h*0.35);
    ctx.fillStyle = '#7d5a30';
    ctx.fillRect(sx + h.w*0.35, ty + h.h*0.55, h.w*0.3, h.h*0.45);
  }
}

function drawRoad() {
  // Grass strip
  ctx.fillStyle = '#5dba4a';
  ctx.fillRect(0, ROAD_TOP - 8, W, 16);

  // Road surface
  const rg = ctx.createLinearGradient(0, ROAD_TOP, 0, ROAD_BOTTOM);
  rg.addColorStop(0, '#555');
  rg.addColorStop(1, '#444');
  ctx.fillStyle = rg;
  ctx.fillRect(0, ROAD_TOP, W, ROAD_BOTTOM - ROAD_TOP);

  // Road edges (white lines)
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, ROAD_TOP + 2);    ctx.lineTo(W, ROAD_TOP + 2);    ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, ROAD_BOTTOM - 2);  ctx.lineTo(W, ROAD_BOTTOM - 2); ctx.stroke();

  // Lane divider (dashed yellow)
  ctx.strokeStyle = '#f1c40f';
  ctx.lineWidth = 3;
  ctx.setLineDash([30, 20]);
  ctx.lineDashOffset = -(worldX % 50);
  ctx.beginPath(); ctx.moveTo(0, ROAD_MID); ctx.lineTo(W, ROAD_MID); ctx.stroke();
  ctx.setLineDash([]);

  // Ground below road
  ctx.fillStyle = '#3a7d2c';
  ctx.fillRect(0, ROAD_BOTTOM, W, H - ROAD_BOTTOM);
}

function drawStar(s) {
  const sx = s.x, sy = LANES[s.lane];
  const r = s.type === 'super' ? 22 : 16;
  const scale = 1 + Math.sin(s.pulse) * 0.15;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(scale, scale);
  if (s.type === 'super') {
    ctx.shadowColor = '#e74c3c'; ctx.shadowBlur = 14;
    ctx.font = `${r*2}px serif`;
  } else {
    ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 10;
    ctx.font = `${r*2}px serif`;
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s.type === 'super' ? '🌟' : '⭐', 0, 0);
  ctx.restore();
}

function drawObstacle(o) {
  const sx = o.x, sy = LANES[o.lane];
  ctx.save();
  ctx.translate(sx, sy);
  if (o.hit) {
    ctx.globalAlpha = Math.max(0, 1 - o.hitAnim / 20);
    ctx.rotate(o.hitAnim * 0.2);
    ctx.scale(1 + o.hitAnim * 0.05, 1 + o.hitAnim * 0.05);
  }
  ctx.font = '36px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const icons = { rock: '🪨', cone: '🚧', pothole: '🕳️' };
  ctx.fillText(icons[o.type] || '🪨', 0, 0);
  ctx.restore();
}

// Nice cartoon car
function drawCar(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(8, 20, 36, 8, 0, 0, Math.PI*2); ctx.fill();

  // Body
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath(); ctx.roundRect(-36, -12, 72, 26, 6); ctx.fill();

  // Cabin
  ctx.fillStyle = '#c0392b';
  ctx.beginPath(); ctx.roundRect(-20, -28, 44, 18, 5); ctx.fill();

  // Windows
  ctx.fillStyle = '#aee6f5';
  ctx.beginPath(); ctx.roundRect(-16, -26, 17, 14, 3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(4,   -26, 17, 14, 3); ctx.fill();

  // Headlights
  ctx.fillStyle = '#ffffaa';
  ctx.beginPath(); ctx.arc(34, -3, 6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffff66';
  ctx.beginPath(); ctx.ellipse(50, -3, 16, 6, 0, 0, Math.PI*2); ctx.fill();

  // Tail lights
  ctx.fillStyle = '#ff6666';
  ctx.beginPath(); ctx.arc(-34, -3, 5, 0, Math.PI*2); ctx.fill();

  // Wheels
  const wheels = [[-20, 16], [18, 16]];
  for (const [wx, wy] of wheels) {
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(wx, wy, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#777';
    ctx.beginPath(); ctx.arc(wx, wy, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    for (let a = 0; a < 4; a++) {
      const ang = a * Math.PI/2 + worldX * 0.06;
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + Math.cos(ang)*9, wy + Math.sin(ang)*9);
      ctx.stroke();
    }
  }

  // Exhaust puffs (when moving fast)
  if (speed > 4 && Math.random() < 0.4) {
    particles.push({
      x: x - 38 + (Math.random()-0.5)*4,
      y: y + 10,
      vx: -speed * 0.4 - Math.random(),
      vy: -0.5 - Math.random(),
      life: 0.7, color: '#bbb', r: 5 + Math.random()*5
    });
  }

  ctx.restore();
}

function drawParticles() {
  ctx.save();
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawPopups() {
  ctx.save();
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = 'bold 20px Comic Sans MS, Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = p.color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillText(p.text,   p.x, p.y);
  }
  ctx.restore();
}

function drawHitFlash() {
  if (gameState === 'dying') {
    ctx.fillStyle = 'rgba(255,0,0,0.25)';
    ctx.fillRect(0, 0, W, H);
  }
}

// ── Main render ────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawMountains();
  drawClouds();
  drawTrees();
  drawHouses();
  drawRoad();

  // Stars (below car)
  for (const s of stars) drawStar(s);
  // Obstacles
  for (const o of obstacles) drawObstacle(o);

  // Car
  const carY = LANES[lane] + jumpY;
  drawCar(140, carY);

  drawParticles();
  drawPopups();
  drawHitFlash();
}

// ── Overlay ─────────────────────────────────────────────────────────
function showOverlay() {
  const card = document.getElementById('menuCard');
  card.querySelector('h2').textContent = score >= 20 ? '🏆 Super gemacht!' : '😢 Oh nein!';
  document.getElementById('finalScore').style.display = 'block';
  document.getElementById('finalScore').textContent = `⭐ ${score} Sterne   🏁 ${dist} m`;
  document.getElementById('startBtn').textContent = '🚗 Nochmal!';
  document.getElementById('overlay').style.display = 'flex';
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  init();
  try { getAC(); } catch(e) {}
}

document.getElementById('startBtn').addEventListener('click', startGame);

// ── Loop ─────────────────────────────────────────────────────────────
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

init();
loop();
</script>
</body>
</html>
