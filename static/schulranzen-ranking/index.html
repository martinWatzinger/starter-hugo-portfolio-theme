<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schulranzen Ranking – Step by Step Giant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    header p { color: #a0b4d0; margin-top: 0.4rem; font-size: 0.95rem; }

    .progress-bar-wrap {
      max-width: 500px;
      margin: 1rem auto 0;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #22d3ee);
      border-radius: 20px;
      transition: width 0.4s ease;
    }
    .progress-label { text-align: center; font-size: 0.82rem; color: #a0b4d0; margin-top: 0.4rem; }

    /* === TABS === */
    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin: 1rem 1rem 0;
      flex-wrap: wrap;
    }
    .tab {
      padding: 0.55rem 1.4rem;
      border-radius: 30px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      color: #0f172a;
      border-color: transparent;
    }

    /* === VOTE SCREEN === */
    #vote-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }
    .question {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #e2e8f0;
    }
    .candidates {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 880px;
    }
    .card {
      flex: 1 1 300px;
      max-width: 390px;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #4ade80;
      box-shadow: 0 12px 40px rgba(74,222,128,0.25);
    }
    .card:active { transform: scale(0.97); }
    .card.winner {
      animation: winPulse 0.5s ease;
      border-color: #4ade80;
      box-shadow: 0 0 40px rgba(74,222,128,0.5);
    }
    .card.loser { opacity: 0.35; transform: scale(0.95); }
    @keyframes winPulse {
      0%   { box-shadow: 0 0 0 rgba(74,222,128,0); }
      50%  { box-shadow: 0 0 60px rgba(74,222,128,0.7); }
      100% { box-shadow: 0 0 40px rgba(74,222,128,0.5); }
    }
    .card-img-wrap {
      width: 100%;
      aspect-ratio: 1;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 0.8rem;
    }
    .card-body { padding: 1rem 1.2rem 1.2rem; }
    .card-name { font-size: 1rem; font-weight: 700; color: #fff; }
    .card-elo { font-size: 0.78rem; color: #94a3b8; margin-top: 0.2rem; }

    .vs-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border-radius: 50%;
      font-weight: 900;
      font-size: 0.9rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      align-self: center;
    }

    .match-count {
      text-align: center;
      color: #a0b4d0;
      font-size: 0.85rem;
      margin-top: 1.2rem;
    }

    /* === RANKING SCREEN === */
    #ranking-screen {
      display: none;
      max-width: 760px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    #ranking-screen h2 { text-align: center; font-size: 1.5rem; margin-bottom: 0.5rem; }
    .ranking-subtitle { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.8rem; }

    /* Podium */
    .podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
    }
    .podium-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 200px;
    }
    .podium-slot.first { order: 2; }
    .podium-slot.second { order: 1; }
    .podium-slot.third { order: 3; }

    .podium-img-wrap {
      width: 90px;
      height: 90px;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .podium-slot.first .podium-img-wrap {
      width: 110px;
      height: 110px;
      border: 3px solid #fbbf24;
      box-shadow: 0 0 30px rgba(251,191,36,0.5);
    }
    .podium-slot.second .podium-img-wrap { border: 2px solid #94a3b8; }
    .podium-slot.third  .podium-img-wrap { border: 2px solid #cd7c3f; }

    .podium-img-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }

    .podium-name {
      font-size: 0.72rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.3rem;
      max-width: 120px;
      line-height: 1.2;
    }

    .podium-block {
      width: 100%;
      border-radius: 10px 10px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 0.2rem;
      font-size: 1.5rem;
      font-weight: 900;
    }
    .podium-slot.first  .podium-block { height: 100px; background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #1a1a1a; }
    .podium-slot.second .podium-block { height: 75px;  background: linear-gradient(180deg, #94a3b8, #64748b); color: #fff; }
    .podium-slot.third  .podium-block { height: 55px;  background: linear-gradient(180deg, #cd7c3f, #a35c26); color: #fff; }

    .podium-elo {
      font-size: 0.68rem;
      font-weight: 700;
      opacity: 0.85;
    }

    /* Full ranking list */
    .ranking-list { list-style: none; }
    .ranking-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 0.7rem 1rem;
      margin-bottom: 0.5rem;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.2s;
    }
    .ranking-item:hover { transform: translateX(4px); }

    .rank-pos { font-size: 1.1rem; font-weight: 900; min-width: 2rem; text-align: center; }
    .rank-pos.gold   { color: #fbbf24; }
    .rank-pos.silver { color: #94a3b8; }
    .rank-pos.bronze { color: #cd7c3f; }

    .rank-img-wrap {
      width: 52px;
      height: 52px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .rank-img-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }

    .rank-info { flex: 1; min-width: 0; }
    .rank-name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-stats { font-size: 0.75rem; color: #94a3b8; margin-top: 0.1rem; }

    .rank-bar-wrap {
      width: 80px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      height: 5px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .rank-bar { height: 100%; background: linear-gradient(90deg,#4ade80,#22d3ee); border-radius: 20px; }
    .rank-elo-val { font-size: 0.8rem; font-weight: 700; color: #4ade80; min-width: 2.8rem; text-align: right; flex-shrink: 0; }

    /* === RENAME MODAL === */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1e293b;
      border-radius: 20px;
      padding: 1.5rem;
      width: 100%;
      max-width: 520px;
      border: 1px solid rgba(255,255,255,0.1);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 1.1rem; margin-bottom: 1rem; }

    .edit-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 0.5rem 0.7rem;
    }
    .edit-thumb {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      flex-shrink: 0;
    }
    .edit-thumb img { width: 100%; height: 100%; object-fit: contain; padding: 2px; }
    .edit-row input {
      flex: 1;
      padding: 0.4rem 0.6rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
    }
    .edit-row input:focus { outline: none; border-color: #4ade80; }

    /* === BUTTONS === */
    .btn-row {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
    .btn {
      padding: 0.7rem 1.6rem;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .btn-primary { background: linear-gradient(135deg,#4ade80,#22d3ee); color: #0f172a; }
    .btn-secondary { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .btn-danger { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }

    @media (max-width: 600px) {
      .candidates { gap: 0.8rem; }
      .card { max-width: 100%; }
      .vs-badge { width: 38px; height: 38px; font-size: 0.75rem; }
      .podium-slot.first .podium-img-wrap { width: 80px; height: 80px; }
      .podium-img-wrap { width: 65px; height: 65px; }
    }
  </style>
</head>
<body>

<header>
  <h1>🎒 Schulranzen Ranking</h1>
  <p>Step by Step Giant – Klicke auf deinen Favoriten!</p>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 Vergleiche</div>
</header>

<div class="tab-bar">
  <button class="tab active" id="tabVote"    onclick="showTab('vote')">⚔️ Vergleich</button>
  <button class="tab"        id="tabRanking" onclick="showTab('ranking')">🏆 Ranking</button>
  <button class="tab"        id="tabEdit"    onclick="openEditModal()">✏️ Namen</button>
</div>

<!-- VOTE -->
<div id="vote-screen">
  <p class="question">Welchen Schulranzen findest du schöner?</p>
  <div class="candidates" id="candidates"></div>
  <div class="match-count" id="matchCount"></div>
  <div class="btn-row" style="margin-top:1.5rem;">
    <button class="btn btn-secondary" onclick="showTab('ranking')">🏆 Ranking ansehen</button>
    <button class="btn btn-danger" onclick="confirmReset()">🗑️ Zurücksetzen</button>
  </div>
</div>

<!-- RANKING -->
<div id="ranking-screen">
  <h2>🏆 Ranking</h2>
  <p class="ranking-subtitle" id="rankingSubtitle"></p>

  <!-- Podium top 3 -->
  <div class="podium" id="podium"></div>

  <!-- Full list -->
  <ul class="ranking-list" id="rankingList"></ul>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="showTab('vote')">⚔️ Weiter vergleichen</button>
    <button class="btn btn-danger"  onclick="confirmReset()">🗑️ Zurücksetzen</button>
  </div>
</div>

<!-- RENAME MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ Namen der Schulranzen anpassen</h3>
    <p style="font-size:0.8rem;color:#94a3b8;margin-bottom:1rem;">Klicke auf ein Feld und gib den Namen des Schulranzens ein.</p>
    <div id="editList"></div>
    <div class="btn-row">
      <button class="btn btn-primary"    onclick="saveEdits()">💾 Speichern</button>
      <button class="btn btn-secondary"  onclick="closeEditModal()">Abbrechen</button>
    </div>
  </div>
</div>

<script>
// =============================================
//  PRODUCT DATA – all 26 unique images
// =============================================
const IMAGE_URLS = [
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00138040abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00138042abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00138044abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00138041abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00138045abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/785px/00138046abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00222601abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00222617abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00222603abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00222602abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00222600abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00213412abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00213413abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00138950abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00213418abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00213564abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/785px/00213555abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00213204abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00213200abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00213554abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/785px/00213202abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00213435abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00213557abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00213559abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/785px/00183677abx.jpg",
  "https://media.brand-distribution.com/stepbystep/pics/2000px/00138941abx.jpg",
];

const DEFAULT_BAGS = IMAGE_URLS.map((url, i) => ({
  id: i + 1,
  name: "Schulranzen " + (i + 1),
  img: url,
  elo: 1000,
  wins: 0,
  losses: 0,
  matches: 0,
}));

const ELO_K = 32;
const STORAGE_KEY = "schulranzen_ranking_v2";

// =============================================
//  STATE
// =============================================
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      // ensure all image URLs still present (in case of updates)
      if (s.bags && s.bags.length > 0) return s;
    }
  } catch(e) {}
  return initState();
}

function initState() {
  return {
    bags: DEFAULT_BAGS.map(b => ({ ...b })),
    totalMatches: 0,
    history: []
  };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// =============================================
//  ELO
// =============================================
function expectedScore(rA, rB) { return 1 / (1 + Math.pow(10, (rB - rA) / 400)); }

function updateElo(winnerId, loserId) {
  const w = state.bags.find(b => b.id === winnerId);
  const l = state.bags.find(b => b.id === loserId);
  const expW = expectedScore(w.elo, l.elo);
  const expL = expectedScore(l.elo, w.elo);
  w.elo = Math.round(w.elo + ELO_K * (1 - expW));
  l.elo = Math.round(l.elo + ELO_K * (0 - expL));
  w.wins++;   w.matches++;
  l.losses++; l.matches++;
  state.totalMatches++;
  state.history.push({ winner: winnerId, loser: loserId });
  saveState();
}

// =============================================
//  PAIR SELECTION
// =============================================
function pickPair() {
  const bags = state.bags;
  let pairs = [];
  for (let i = 0; i < bags.length; i++) {
    for (let j = i + 1; j < bags.length; j++) {
      const pm = state.history.filter(
        h => (h.winner === bags[i].id && h.loser === bags[j].id) ||
             (h.winner === bags[j].id && h.loser === bags[i].id)
      ).length;
      pairs.push({ a: bags[i], b: bags[j], pm });
    }
  }
  pairs.sort((x, y) => x.pm - y.pm);
  const min = pairs[0].pm;
  const pool = pairs.filter(p => p.pm === min);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  return Math.random() < 0.5 ? [pick.a, pick.b] : [pick.b, pick.a];
}

// =============================================
//  VOTE RENDER
// =============================================
let currentPair = null;

function renderVote() {
  currentPair = pickPair();
  const [a, b] = currentPair;
  document.getElementById('candidates').innerHTML =
    cardHTML(a) +
    '<div class="vs-badge">VS</div>' +
    cardHTML(b);
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => vote(parseInt(card.dataset.id)));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') vote(parseInt(card.dataset.id)); });
  });
  updateProgress();
}

function cardHTML(bag) {
  return `
    <div class="card" data-id="${bag.id}" role="button" tabindex="0" aria-label="${esc(bag.name)} auswählen">
      <div class="card-img-wrap">
        <img src="${esc(bag.img)}" alt="${esc(bag.name)}" loading="lazy">
      </div>
      <div class="card-body">
        <div class="card-name">${esc(bag.name)}</div>
        <div class="card-elo">ELO: ${bag.elo} &nbsp;·&nbsp; ${bag.wins}W / ${bag.losses}L</div>
      </div>
    </div>`;
}

function vote(winnerId) {
  if (!currentPair) return;
  const loserId = currentPair.find(b => b.id !== winnerId).id;
  document.querySelectorAll('.card').forEach(card => {
    const id = parseInt(card.dataset.id);
    card.classList.add(id === winnerId ? 'winner' : 'loser');
    card.style.pointerEvents = 'none';
  });
  setTimeout(() => { updateElo(winnerId, loserId); renderVote(); }, 500);
}

// =============================================
//  RANKING RENDER
// =============================================
function renderRanking() {
  const sorted = [...state.bags].sort((a, b) => b.elo - a.elo);
  const maxElo = sorted[0]?.elo || 1200;
  const minElo = sorted[sorted.length - 1]?.elo || 800;

  // Subtitle
  const n = state.bags.length;
  const fullCoverage = (n * (n - 1)) / 2;
  const pct = Math.min(100, Math.round((state.totalMatches / (fullCoverage * 2)) * 100));
  document.getElementById('rankingSubtitle').textContent =
    `${state.totalMatches} Vergleiche · ${pct}% Abdeckung` +
    (state.totalMatches < 10 ? ' · Noch zu wenig Daten für sicheres Ranking' :
     state.totalMatches < 40 ? ' · Ranking wird stabiler…' : ' · Ranking ist aussagekräftig ✓');

  // Podium (top 3)
  const top3 = sorted.slice(0, 3);
  document.getElementById('podium').innerHTML = top3.map((bag, i) => {
    const cls = ['first','second','third'][i];
    const medal = ['🥇','🥈','🥉'][i];
    return `
      <div class="podium-slot ${cls}">
        <div class="podium-img-wrap">
          <img src="${esc(bag.img)}" alt="${esc(bag.name)}" loading="lazy">
        </div>
        <div class="podium-name">${esc(bag.name)}</div>
        <div class="podium-block">
          ${medal}
          <div class="podium-elo">${bag.elo} ELO</div>
        </div>
      </div>`;
  }).join('');

  // Full list
  document.getElementById('rankingList').innerHTML = sorted.map((bag, i) => {
    const rank = i + 1;
    const posClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
    const barW = maxElo === minElo ? 50 : Math.round(((bag.elo - minElo) / (maxElo - minElo)) * 100);
    return `
      <li class="ranking-item">
        <span class="rank-pos ${posClass}">${medal}</span>
        <div class="rank-img-wrap">
          <img src="${esc(bag.img)}" alt="${esc(bag.name)}" loading="lazy">
        </div>
        <div class="rank-info">
          <div class="rank-name">${esc(bag.name)}</div>
          <div class="rank-stats">${bag.wins}W · ${bag.losses}L · ${bag.matches} Vergleiche</div>
        </div>
        <div class="rank-bar-wrap"><div class="rank-bar" style="width:${barW}%"></div></div>
        <span class="rank-elo-val">${bag.elo}</span>
      </li>`;
  }).join('');
}

// =============================================
//  PROGRESS
// =============================================
function updateProgress() {
  const n = state.bags.length;
  const full = (n * (n - 1)) / 2;
  const pct = Math.min(100, Math.round((state.totalMatches / (full * 2)) * 100));
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent =
    `${state.totalMatches} Vergleich${state.totalMatches !== 1 ? 'e' : ''} – ${pct}% Abdeckung`;
  document.getElementById('matchCount').textContent =
    state.totalMatches < 10  ? '⚡ Noch ein paar Vergleiche für ein aussagekräftiges Ranking!' :
    state.totalMatches < 50  ? '📈 Gut! Ranking wird immer genauer…' :
                               '🎉 Super! Das Ranking ist jetzt sehr aussagekräftig.';
}

// =============================================
//  TABS
// =============================================
function showTab(tab) {
  document.getElementById('vote-screen').style.display    = tab === 'vote'    ? 'flex' : 'none';
  document.getElementById('ranking-screen').style.display = tab === 'ranking' ? 'block' : 'none';
  document.getElementById('tabVote').classList.toggle('active',    tab === 'vote');
  document.getElementById('tabRanking').classList.toggle('active', tab === 'ranking');
  if (tab === 'ranking') renderRanking();
  if (tab === 'vote')    renderVote();
}

// =============================================
//  RENAME MODAL
// =============================================
function openEditModal() {
  document.getElementById('editList').innerHTML = state.bags.map(bag => `
    <div class="edit-row">
      <div class="edit-thumb"><img src="${esc(bag.img)}" alt="" loading="lazy"></div>
      <input type="text" id="name_${bag.id}" value="${esc(bag.name)}" placeholder="Name eingeben…">
    </div>`).join('');
  document.getElementById('editModal').classList.add('open');
}

function closeEditModal() { document.getElementById('editModal').classList.remove('open'); }

function saveEdits() {
  state.bags.forEach(bag => {
    const inp = document.getElementById('name_' + bag.id);
    if (inp && inp.value.trim()) bag.name = inp.value.trim();
  });
  saveState();
  closeEditModal();
  renderVote();
}

// =============================================
//  RESET
// =============================================
function confirmReset() {
  if (confirm('Wirklich alles zurücksetzen? Das gesamte Ranking geht verloren.')) {
    const names = Object.fromEntries(state.bags.map(b => [b.id, b.name]));
    state = initState();
    state.bags.forEach(b => { if (names[b.id]) b.name = names[b.id]; });
    saveState();
    showTab('vote');
  }
}

// =============================================
//  UTIL
// =============================================
function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// =============================================
//  INIT
// =============================================
showTab('vote');
</script>
</body>
</html>
